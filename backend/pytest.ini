[tool:pytest]
# Pytest configuration for backend tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers configuration
markers =
    mock: Mock-based unit tests with mocked dependencies
    fast: Fast-running tests (typically mock-based)
    unit: Unit tests
    integration: Integration tests with real database
    e2e: End-to-end tests
    auth: Authentication-related tests
    upload: Upload-related tests
    search: Search-related tests
    performance: Performance tests
    security: Security tests
    slow: Slow-running tests that should be excluded from quick runs

# Test output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.: