name: Docker Multi-Arch Build

on:
  push:
    branches: 
      - 'v*.*.*'  # Only build on version branches (v1.0.0, v2.1.2, etc.)
      - 'main'
      - 'master'
      - 'develop'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: bradenacurtis801
  REPOSITORY_NAME: scanpro

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Make script executable
      run: chmod +x scripts/docker/build-multiarch.sh
      
    - name: Run your build script
      run: |
        if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Detected version branch (${GITHUB_REF_NAME}), running Docker build and push..."
          ./scripts/docker/build-multiarch.sh
        else
          echo "Not a version branch (${GITHUB_REF_NAME}), skipping Docker push."
        fi
      env:
        DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
        REPOSITORY_NAME: ${{ env.REPOSITORY_NAME }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}