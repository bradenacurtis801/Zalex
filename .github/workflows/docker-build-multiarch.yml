name: Docker Multi-Arch Build

on:
  push:
    branches: 
      - 'v*.*.*'  # Only build on version branches (v1.0.0, v2.1.2, etc.)
      - 'main'
      - 'master'
      - 'develop'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: bradenacurtis801
  REPOSITORY_NAME: SabioDocs

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run this job for version branches (v*.*.* pattern)
    # GitHub Actions doesn't support regex, so we check if branch starts with 'v' and has dots
    if: startsWith(github.ref_name, 'v') && contains(github.ref_name, '.') && !contains(github.ref_name, '/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Make script executable
      run: chmod +x scripts/docker/build-multiarch.sh
      
    - name: Run build script
      run: ./scripts/docker/build-multiarch.sh
      env:
        DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
        REPOSITORY_NAME: ${{ env.REPOSITORY_NAME }}
        GITHUB_REF_NAME: ${{ github.ref_name }}