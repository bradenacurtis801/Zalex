name: Build and Deploy ScanPro

on:
  push:
    branches: [ main, v* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  REPOSITORY_NAME: ${{ secrets.REPOSITORY_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract version from branch/tag
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        elif [[ $GITHUB_REF == refs/heads/v* ]]; then
          VERSION=${GITHUB_REF#refs/heads/}
        else
          VERSION="latest"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:${{ steps.version.outputs.version }}
          ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update latest tag
      if: github.ref == 'refs/heads/main'
      run: |
        docker pull ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:latest
        docker tag ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:latest ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:latest
        docker push ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:latest

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build local image for testing
      run: |
        docker build -t ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:test .
        
    - name: Run basic tests
      run: |
        # Add your test commands here
        echo "Running tests on ${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:test"
