version: '3.8'

services:
  scanpro:
    build: 
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "3000:3000"  # Frontend
      - "5000:5000"  # Backend
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=5000
      - BACKEND_HOST=0.0.0.0
      - DEBUG=false
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      # Mount for persistent data
      - scanpro_data:/app/backend/APP_DATA
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  scanpro_data:
